<aside class="flex flex-col h-full bg-slate-950 text-white relative z-20"
  [style.width]="collapsed() ? '68px' : '240px'">

  <!-- Brand -->
  <div class="flex items-center gap-3 px-4 h-16 border-b border-white/[0.06] flex-shrink-0">
    <div class="flex-shrink-0 w-8 h-8 rounded-xl bg-gradient-to-br from-blue-500 to-violet-600 flex items-center justify-center shadow-lg">
      <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"/>
      </svg>
    </div>
    @if (!collapsed()) {
      <span class="text-sm font-extrabold tracking-tight text-white truncate">
        TranspoSync
      </span>
    }
    <button (click)="toggleCollapse()" class="ml-auto p-1.5 rounded-lg hover:bg-white/8 transition text-slate-500 hover:text-slate-300 flex-shrink-0">
      <svg class="w-3.5 h-3.5 transition-transform duration-300" [class.rotate-180]="collapsed()" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/>
      </svg>
    </button>
  </div>

  <!-- Nav Section Label -->
  @if (!collapsed()) {
    <div class="px-4 pt-5 pb-2">
      <span class="text-[10px] font-bold text-slate-600 uppercase tracking-[0.14em]">Navigation</span>
    </div>
  }
  @if (collapsed()) {
    <div class="pt-4"></div>
  }

  <!-- Navigation -->
  <nav class="flex-1 px-2 space-y-0.5 overflow-y-auto">
    <a routerLink="/app/dashboard" routerLinkActive="active-nav"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-item group flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-400 hover:bg-white/[0.06] hover:text-white transition-all relative"
      [title]="collapsed() ? 'Dashboard' : ''">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h4a1 1 0 011 1v5a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM14 5a1 1 0 011-1h4a1 1 0 011 1v2a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1v-4zM14 13a1 1 0 011-1h4a1 1 0 011 1v6a1 1 0 01-1 1h-4a1 1 0 01-1-1v-6z"/>
      </svg>
      @if (!collapsed()) {
        <span class="text-sm font-medium truncate">Dashboard</span>
      }
    </a>

    <a routerLink="/app/transport" routerLinkActive="active-nav"
      class="nav-item group flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-400 hover:bg-white/[0.06] hover:text-white transition-all"
      [title]="collapsed() ? 'Transport' : ''">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
      </svg>
      @if (!collapsed()) {
        <span class="text-sm font-medium truncate">Transport</span>
      }
    </a>

    <a routerLink="/app/inventory" routerLinkActive="active-nav"
      class="nav-item group flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-400 hover:bg-white/[0.06] hover:text-white transition-all"
      [title]="collapsed() ? 'Inventory' : ''">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
      </svg>
      @if (!collapsed()) {
        <span class="text-sm font-medium truncate">Inventory</span>
      }
    </a>

    <!-- Divider -->
    <div class="my-2 border-t border-white/[0.06]"></div>

    <a routerLink="/app/user-profile" routerLinkActive="active-nav"
      class="nav-item group flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-400 hover:bg-white/[0.06] hover:text-white transition-all"
      [title]="collapsed() ? 'Profile' : ''">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      @if (!collapsed()) {
        <span class="text-sm font-medium truncate">Profile</span>
      }
    </a>
  </nav>

  <!-- Bottom: Version -->
  <div class="px-4 py-3 border-t border-white/[0.06] flex-shrink-0">
    @if (!collapsed()) {
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-500 relative pulse-ring"></span>
        <span class="text-xs text-slate-600">All systems operational</span>
      </div>
    }
    @if (collapsed()) {
      <div class="flex justify-center">
        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
      </div>
    }
  </div>
</aside>

<style>
  .active-nav {
  background: rgba(59, 130, 246, 0.15) !important;
  color: #60a5fa !important;
  border: 1px solid rgba(59, 130, 246, 0.2);
}
.active-nav svg { color: #3b82f6; }
</style>
