<aside
    class="flex flex-col h-full bg-slate-900 dark:bg-gray-950 text-white transition-all duration-300 shadow-xl"
    [class.w-64]="!collapsed()"
    [class.w-16]="collapsed()">

    <!-- Brand -->
    <div class="flex items-center gap-3 px-4 py-5 border-b border-white/10 min-h-[68px]">
        <div class="flex-shrink-0 w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center shadow">
            <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
        </div>
        <span *ngIf="!collapsed()" class="text-base font-extrabold tracking-tight text-white truncate">
            TranspoSync
        </span>
        <button (click)="toggleCollapse()"
            class="ml-auto p-1 rounded-lg hover:bg-white/10 transition text-slate-400 hover:text-white flex-shrink-0">
            <svg class="w-4 h-4 transition-transform" [class.rotate-180]="collapsed()" fill="none"
                viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
            </svg>
        </button>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 px-2 py-4 space-y-1 overflow-y-auto">
        <!-- Dashboard -->
        <a routerLink="/app/dashboard" routerLinkActive="bg-blue-600 text-white"
            [routerLinkActiveOptions]="{ exact: true }"
            class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-400 hover:bg-white/10 hover:text-white transition group">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
            </svg>
            <span *ngIf="!collapsed()" class="text-sm font-medium truncate">Dashboard</span>
        </a>

        <!-- Transport -->
        <a routerLink="/app/transport" routerLinkActive="bg-blue-600 text-white"
            class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-400 hover:bg-white/10 hover:text-white transition group">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10l1 1h1m8-1h3l3-3V9a1 1 0 00-1-1h-3.5l-1 1H13v6z" />
            </svg>
            <span *ngIf="!collapsed()" class="text-sm font-medium truncate">Transport</span>
        </a>

        <!-- Inventory -->
        <a routerLink="/app/inventory" routerLinkActive="bg-blue-600 text-white"
            class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-400 hover:bg-white/10 hover:text-white transition group">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
            </svg>
            <span *ngIf="!collapsed()" class="text-sm font-medium truncate">Inventory</span>
        </a>

        <!-- User Profile -->
        <a routerLink="/app/user-profile" routerLinkActive="bg-blue-600 text-white"
            class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-400 hover:bg-white/10 hover:text-white transition group">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
            <span *ngIf="!collapsed()" class="text-sm font-medium truncate">Profile</span>
        </a>
    </nav>

    <!-- Version Footer -->
    <div *ngIf="!collapsed()" class="px-4 py-3 border-t border-white/10">
        <p class="text-xs text-slate-500">TranspoSync v1.0.0</p>
    </div>
</aside>
