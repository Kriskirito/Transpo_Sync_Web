<header class="flex items-center justify-between px-6 bg-white dark:bg-slate-900 border-b border-gray-100 dark:border-white/[0.06] h-16 flex-shrink-0 shadow-sm">
    <!-- Left: breadcrumb area -->
    <div class="flex items-center gap-2 text-sm text-gray-500 dark:text-slate-400">
        <svg class="w-4 h-4 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
        <span class="font-semibold text-gray-900 dark:text-white text-sm">TranspoSync</span>
    </div>

    <!-- Right Actions -->
    <div class="flex items-center gap-2">
        <!-- Search -->
        <button class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-xl text-sm text-gray-400 bg-gray-100 dark:bg-white/5 hover:bg-gray-200 dark:hover:bg-white/10 transition border border-transparent dark:border-white/[0.06]">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 11A6 6 0 115 11a6 6 0 0112 0z"/>
            </svg>
            <span class="text-xs">Search...</span>
            <kbd class="hidden lg:inline-block text-[10px] px-1.5 py-0.5 rounded bg-gray-200 dark:bg-white/10 text-gray-500 dark:text-slate-500">⌘K</kbd>
        </button>

        <!-- Notifications -->
        <button class="relative p-2 rounded-xl text-gray-500 dark:text-slate-400 hover:bg-gray-100 dark:hover:bg-white/[0.06] transition">
            <svg class="w-4.5 h-4.5 w-[18px] h-[18px]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
            </svg>
            <span class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-red-500 border-2 border-white dark:border-slate-900"></span>
        </button>

        <!-- Divider -->
        <div class="w-px h-6 bg-gray-200 dark:bg-white/10 mx-1"></div>

        <!-- User Menu -->
        <div class="relative">
            <button (click)="toggleDropdown()"
                class="flex items-center gap-2.5 px-2 py-1.5 rounded-xl hover:bg-gray-100 dark:hover:bg-white/[0.06] transition">
                <div class="relative w-8 h-8 rounded-xl overflow-hidden flex-shrink-0">
                    <div class="w-full h-full bg-gradient-to-br from-blue-500 to-violet-600 flex items-center justify-center">
                        <img *ngIf="userDetails()?.picture" [src]="userDetails()!.picture"
                            [alt]="userDetails()!.name" class="w-full h-full object-cover" />
                        <span *ngIf="!userDetails()?.picture" class="text-xs font-bold text-white">
                            {{ userInitials() }}
                        </span>
                    </div>
                    <span class="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full bg-emerald-500 border-2 border-white dark:border-slate-900"></span>
                </div>
                <div class="hidden sm:block text-left">
                    <p class="text-xs font-semibold text-gray-900 dark:text-white leading-tight">
                        {{ userDetails()?.given_name || 'User' }}
                    </p>
                    <p class="text-[10px] text-gray-400 dark:text-slate-500 leading-tight">Operator</p>
                </div>
                <svg class="w-3.5 h-3.5 text-gray-400 transition-transform duration-200"
                    [class.rotate-180]="showDropdown" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                </svg>
            </button>

            <!-- Dropdown -->
            <div *ngIf="showDropdown"
                class="absolute right-0 mt-2 w-52 rounded-2xl bg-white dark:bg-slate-900 shadow-xl border border-gray-100 dark:border-white/10 py-1.5 z-50 overflow-hidden">
                <!-- User info header -->
                <div class="px-4 py-3 border-b border-gray-100 dark:border-white/[0.06]">
                    <p class="text-xs font-semibold text-gray-900 dark:text-white">{{ userDetails()?.name || 'User' }}</p>
                    <p class="text-[11px] text-gray-400 dark:text-slate-500 mt-0.5 truncate">{{ userDetails()?.email || '' }}</p>
                </div>
                <div class="py-1">
                    <a routerLink="/app/user-profile" (click)="showDropdown = false"
                        class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 dark:text-slate-300 hover:bg-gray-50 dark:hover:bg-white/[0.06] transition">
                        <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        My Profile
                    </a>
                    <a href="#"
                        class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 dark:text-slate-300 hover:bg-gray-50 dark:hover:bg-white/[0.06] transition">
                        <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                        Settings
                    </a>
                </div>
                <div class="border-t border-gray-100 dark:border-white/[0.06] py-1">
                    <button (click)="handleSignOut()"
                        class="flex items-center gap-3 w-full px-4 py-2.5 text-sm text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-500/10 transition">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                        </svg>
                        Sign Out
                    </button>
                </div>
            </div>
        </div>
    </div>
</header>
